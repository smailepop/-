<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>時間管理アプリ</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500;600&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary: #4a9eff;
            --primary-dark: #3a7fd5;
            --secondary: #6eb5ff;
            --accent: #ff6b6b;
            --success: #51cf66;
            --warning: #ffd43b;
            --bg-main: #000000;
            --bg-card: #1a1a1a;
            --bg-card-light: #2a2a2a;
            --text-primary: #e8e8e8;
            --text-secondary: #a0a0a0;
            --border: #333333;
            --shadow: rgba(0, 0, 0, 0.5);
            --header-text: #ffffff;
        }
        
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background: var(--bg-main);
            color: var(--text-primary);
            line-height: 1.6;
            padding-bottom: 80px;
        }
        
        .header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: var(--header-text);
            padding: 20px;
            box-shadow: 0 2px 8px var(--shadow);
            position: sticky;
            top: 0;
            z-index: 101;
        }
        
        .header h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--header-text);
        }
        
        .header p {
            font-size: 14px;
            opacity: 0.9;
            color: var(--header-text);
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 16px;
        }
        
        .nav-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 20px;
            background: var(--bg-card);
            padding: 8px;
            border-radius: 12px;
            box-shadow: 0 2px 4px var(--shadow);
            border: 1px solid var(--border);
            overflow-x: auto;
            position: sticky;
            top: 110px;
            z-index: 100;
        }
        
        .nav-tab {
            flex: 1;
            min-width: 70px;
            padding: 10px 8px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 13px;
            white-space: nowrap;
        }
        
        .nav-tab.active {
            background: var(--primary);
            color: white;
        }
        
        .section {
            display: none;
        }
        
        .section.active {
            display: block;
        }
        
        .card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px var(--shadow);
            border: 1px solid var(--border);
            animation: slideUp 0.3s ease-out;
        }
        
        .card-header {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--primary);
        }
        
        .timer-container {
            background: var(--bg-card-light);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            border: 1px solid var(--border);
        }
        
        .timer-task-name {
            font-weight: 600;
            font-size: 16px;
            color: var(--primary);
            margin-bottom: 12px;
        }
        
        .timer-display {
            font-family: 'JetBrains Mono', monospace;
            font-size: 28px;
            font-weight: 500;
            text-align: center;
            color: var(--primary);
            margin: 16px 0;
        }
        
        .running {
            animation: pulse 2s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        
        .timer-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }
        
        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
            font-family: 'Noto Sans JP', sans-serif;
        }
        
        .btn-primary {
            background: var(--primary);
            color: white;
        }
        
        .btn-primary:hover {
            background: var(--primary-dark);
        }
        
        .btn-success {
            background: var(--success);
            color: white;
        }
        
        .btn-warning {
            background: var(--warning);
            color: var(--text-primary);
        }
        
        .btn-danger {
            background: var(--accent);
            color: white;
        }
        
        .btn-secondary {
            background: var(--text-secondary);
            color: white;
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .btn-icon {
            width: 36px;
            height: 36px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            font-size: 16px;
        }
        
        .form-group {
            margin-bottom: 16px;
        }
        
        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text-primary);
        }
        
        .form-input, .form-select {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 16px;
            font-family: 'Noto Sans JP', sans-serif;
            transition: border-color 0.3s;
            background: var(--bg-card-light);
            color: var(--text-primary);
        }
        
        .form-input:focus, .form-select:focus {
            outline: none;
            border-color: var(--primary);
        }
        
        /* 無限スクロールピッカー（iPhone風） */
        .infinite-picker-container {
            margin-bottom: 16px;
        }
        
        .infinite-picker-wrapper {
            position: relative;
            height: 220px;
            display: flex;
            background: var(--bg-card-light);
            border-radius: 12px;
            border: 2px solid var(--border);
            overflow: hidden;
        }
        
        .picker-column {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: column;
        }
        
        .picker-scroll-area {
            flex: 1;
            overflow-y: scroll;
            padding: 90px 0;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
        }
        
        .picker-scroll-area::-webkit-scrollbar {
            display: none;
        }
        
        .picker-option-infinite {
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            color: var(--text-secondary);
            transition: all 0.2s;
            opacity: 0.3;
        }
        
        .picker-option-infinite.selected {
            color: var(--text-primary);
            font-size: 24px;
            font-weight: 700;
            opacity: 1;
        }
        
        .picker-label {
            position: absolute;
            top: 50%;
            right: 8px;
            transform: translateY(-50%);
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            pointer-events: none;
            z-index: 2;
        }
        
        .picker-highlight-box {
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 50px;
            transform: translateY(-50%);
            background: rgba(74, 158, 255, 0.15);
            border-top: 2px solid var(--primary);
            border-bottom: 2px solid var(--primary);
            pointer-events: none;
            z-index: 1;
        }
        
        .summary-box {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: var(--header-text);
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            margin-bottom: 20px;
        }
        
        .summary-label {
            font-size: 14px;
            opacity: 0.9;
            color: var(--header-text);
        }
        
        .summary-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 36px;
            font-weight: 700;
            color: var(--header-text);
        }
        
        .breakdown-item {
            background: var(--bg-card-light);
            border-radius: 8px;
            margin-bottom: 8px;
            border: 1px solid var(--border);
            overflow: hidden;
        }
        
        .breakdown-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .breakdown-header:hover {
            background: rgba(74, 158, 255, 0.1);
        }
        
        .breakdown-left {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
        }
        
        .breakdown-task {
            font-weight: 500;
        }
        
        .expand-icon {
            font-size: 12px;
            transition: transform 0.3s;
            color: var(--text-secondary);
        }
        
        .expand-icon.expanded {
            transform: rotate(180deg);
        }
        
        .breakdown-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .breakdown-time {
            font-family: 'Noto Sans JP', sans-serif;
            font-weight: 600;
            color: var(--primary);
            font-size: 14px;
        }
        
        .breakdown-details {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
            border-top: 1px solid var(--border);
        }
        
        .breakdown-details.expanded {
            max-height: 500px;
        }
        
        .breakdown-detail-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px;
            background: var(--bg-main);
            margin: 8px;
            border-radius: 6px;
            border: 1px solid var(--border);
        }
        
        .breakdown-detail-time {
            font-family: 'Noto Sans JP', sans-serif;
            font-weight: 500;
            color: var(--text-secondary);
            font-size: 13px;
        }
        
        .date-display {
            font-size: 28px;
            font-weight: 700;
            text-align: center;
            color: var(--text-primary);
            margin-bottom: 20px;
            padding: 16px;
            background: var(--bg-card);
            border-radius: 12px;
            border: 1px solid var(--border);
        }
        
        .date-navigation {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
            padding: 12px;
            background: var(--bg-card);
            border-radius: 12px;
            border: 1px solid var(--border);
        }
        
        .date-nav-btn {
            width: 40px;
            height: 40px;
            border: none;
            background: var(--primary);
            color: white;
            border-radius: 8px;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .date-nav-btn:hover {
            background: var(--primary-dark);
        }
        
        .date-nav-label {
            font-weight: 600;
            font-size: 16px;
            min-width: 100px;
            text-align: center;
        }
        
        .pie-chart-container {
            margin-bottom: 20px;
            padding: 20px;
            background: var(--bg-card);
            border-radius: 16px;
            border: 1px solid var(--border);
        }
        
        .pie-chart {
            width: 100%;
            max-width: 300px;
            height: 300px;
            margin: 0 auto;
        }
        
        .chart-legend {
            margin-top: 20px;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
            padding: 8px;
            background: var(--bg-card-light);
            border-radius: 8px;
        }
        
        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 4px;
            flex-shrink: 0;
        }
        
        .legend-task {
            flex: 1;
            font-weight: 500;
        }
        
        .record-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: var(--bg-card-light);
            border-radius: 8px;
            margin-bottom: 8px;
            border: 1px solid var(--border);
        }
        
        .record-info {
            flex: 1;
        }
        
        .record-task {
            font-weight: 600;
            margin-bottom: 4px;
        }
        
        .record-meta {
            font-size: 12px;
            color: var(--text-secondary);
        }
        
        .record-time {
            font-family: 'Noto Sans JP', sans-serif;
            font-weight: 600;
            color: var(--primary);
            margin-right: 12px;
            font-size: 14px;
        }
        
        .record-actions {
            display: flex;
            gap: 8px;
        }
        
        .task-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: var(--bg-card-light);
            border-radius: 8px;
            margin-bottom: 8px;
            border: 1px solid var(--border);
        }
        
        .color-picker-group {
            margin-bottom: 20px;
        }
        
        .color-preview {
            width: 100%;
            height: 60px;
            border-radius: 8px;
            border: 2px solid var(--border);
            margin-top: 8px;
        }
        
        .color-input {
            width: 100%;
            height: 50px;
            border: 2px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 24px;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid var(--border);
        }
        
        .modal-header {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--primary);
        }
        
        .modal-buttons {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }
        
        .modal-buttons .btn {
            flex: 1;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
        }
        
        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>⏱️ 時間管理</h1>
        <p id="currentDateTime"></p>
    </div>

    <div class="container">
        <div class="nav-tabs">
            <button class="nav-tab active" onclick="switchTab('timer')">タイマー</button>
            <button class="nav-tab" onclick="switchTab('daily')">日別</button>
            <button class="nav-tab" onclick="switchTab('weekly')">週別</button>
            <button class="nav-tab" onclick="switchTab('history')">履歴</button>
            <button class="nav-tab" onclick="switchTab('tasks')">作業管理</button>
            <button class="nav-tab" onclick="switchTab('settings')">設定</button>
        </div>

        <!-- タイマーセクション -->
        <div id="timer" class="section active">
            <div class="card">
                <div class="card-header">アクティブタイマー</div>
                <div id="activeTimers"></div>
                <button class="btn btn-primary" onclick="showNewTimerModal()" style="width: 100%; margin-top: 12px;">
                    ➕ 新しいタイマーを開始
                </button>
            </div>

            <div class="card">
                <button class="btn btn-success" onclick="openManualEntryModal()" style="width: 100%;">➕ 手動入力</button>
            </div>
        </div>

        <!-- 日別セクション -->
        <div id="daily" class="section">
            <div class="date-navigation">
                <button class="date-nav-btn" onclick="navigateDaily(-1)">＜</button>
                <div class="date-nav-label" id="dailyNavLabel">今日</div>
                <button class="date-nav-btn" onclick="navigateDaily(1)">＞</button>
            </div>
            
            <div class="date-display" id="dailyDateDisplay"></div>
            
            <div class="pie-chart-container">
                <canvas id="dailyPieChart" class="pie-chart"></canvas>
                <div id="dailyChartLegend" class="chart-legend"></div>
            </div>

            <div class="summary-box">
                <div class="summary-label">総時間</div>
                <div class="summary-value" id="dailyTotal">0時間0分0秒</div>
            </div>

            <div class="card">
                <div class="card-header" style="display: flex; justify-content: space-between; align-items: center;">
                    <span>作業別内訳</span>
                    <button class="btn btn-primary" onclick="copyDailyBreakdown()" style="padding: 8px 16px; font-size: 13px;">📋 コピー</button>
                </div>
                <div id="dailyBreakdown"></div>
            </div>

            <div class="card">
                <div class="card-header">記録一覧</div>
                <div id="dailyRecords"></div>
            </div>
        </div>

        <!-- 週別セクション -->
        <div id="weekly" class="section">
            <div class="date-navigation">
                <button class="date-nav-btn" onclick="navigateWeekly(-1)">＜</button>
                <div class="date-nav-label" id="weeklyNavLabel">今週</div>
                <button class="date-nav-btn" onclick="navigateWeekly(1)">＞</button>
            </div>
            
            <div class="date-display" id="weeklyDateDisplay"></div>
            
            <div class="pie-chart-container">
                <canvas id="weeklyPieChart" class="pie-chart"></canvas>
                <div id="weeklyChartLegend" class="chart-legend"></div>
            </div>

            <div class="summary-box">
                <div class="summary-label">総時間</div>
                <div class="summary-value" id="weeklyTotal">0時間0分0秒</div>
            </div>

            <div class="card">
                <div class="card-header">作業別内訳</div>
                <div id="weeklyBreakdown"></div>
            </div>

            <div class="card">
                <div class="card-header">日別サマリー</div>
                <div id="weeklyDailySummary"></div>
            </div>
        </div>

        <!-- 履歴セクション -->
        <div id="history" class="section">
            <div class="card">
                <div class="card-header">期間指定</div>
                <p style="font-size: 13px; color: var(--text-secondary); margin-bottom: 16px;">
                    ※開始日のみ入力で「開始日〜現在」、終了日のみで「過去〜終了日」、両方空欄で「全期間」を表示
                </p>
                <div class="form-group">
                    <label class="form-label">開始日（任意）</label>
                    <div id="historyStartDatePicker"></div>
                </div>
                <div class="form-group">
                    <label class="form-label">終了日（任意）</label>
                    <div id="historyEndDatePicker"></div>
                </div>
                <button class="btn btn-primary" onclick="loadHistory()" style="width: 100%;">検索</button>
            </div>

            <div id="historyResults"></div>
        </div>

        <!-- 作業管理セクション -->
        <div id="tasks" class="section">
            <div class="card">
                <div class="card-header">新しい作業を登録</div>
                <form onsubmit="addTask(event)">
                    <div class="form-group">
                        <label class="form-label">作業名</label>
                        <input type="text" class="form-input" id="newTaskName" placeholder="例：YouTube対応" required>
                    </div>
                    <button type="submit" class="btn btn-success" style="width: 100%;">登録</button>
                </form>
            </div>

            <div class="card">
                <div class="card-header">登録済み作業</div>
                <div id="taskList"></div>
            </div>
        </div>

        <!-- 設定セクション -->
        <div id="settings" class="section">
            <div class="card">
                <div class="card-header">カラー設定</div>
                
                <div class="color-picker-group">
                    <label class="form-label">背景色</label>
                    <input type="color" class="color-input" id="bgColorPicker" value="#000000">
                    <div class="color-preview" id="bgColorPreview" style="background: #000000;"></div>
                </div>

                <div class="color-picker-group">
                    <label class="form-label">メインカラー</label>
                    <input type="color" class="color-input" id="primaryColorPicker" value="#4a9eff">
                    <div class="color-preview" id="primaryColorPreview" style="background: #4a9eff;"></div>
                </div>

                <div class="color-picker-group">
                    <label class="form-label">文字色</label>
                    <input type="color" class="color-input" id="textColorPicker" value="#e8e8e8">
                    <div class="color-preview" id="textColorPreview" style="background: #e8e8e8;"></div>
                </div>

                <div class="color-picker-group">
                    <label class="form-label">ヘッダー・総時間の文字色</label>
                    <input type="color" class="color-input" id="headerTextColorPicker" value="#ffffff">
                    <div class="color-preview" id="headerTextColorPreview" style="background: #ffffff;"></div>
                </div>

                <button class="btn btn-secondary" onclick="resetColors()" style="width: 100%; margin-top: 12px;">
                    デフォルトに戻す
                </button>
            </div>
        </div>
    </div>

    <!-- 新規タイマーモーダル -->
    <div id="newTimerModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">新しいタイマー</div>
            <div class="form-group">
                <label class="form-label">作業</label>
                <select class="form-select" id="newTimerTask" onchange="toggleCustomTaskInput()">
                    <option value="">選択してください</option>
                </select>
            </div>
            <div class="form-group" id="customTaskGroup" style="display: none;">
                <label class="form-label">新しい作業名</label>
                <input type="text" class="form-input" id="customTaskInput" placeholder="作業名を入力">
            </div>
            <div class="modal-buttons">
                <button class="btn btn-secondary" onclick="closeModal('newTimerModal')">キャンセル</button>
                <button class="btn btn-primary" onclick="startNewTimer()">開始</button>
            </div>
        </div>
    </div>

    <!-- 編集モーダル -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">記録を編集</div>
            <div class="form-group">
                <label class="form-label">作業</label>
                <select class="form-select" id="editTask"></select>
            </div>
            <div class="form-group">
                <label class="form-label">日付</label>
                <div style="display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 8px;">
