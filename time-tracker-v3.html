    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
    <script>
        // データ構造
        let tasks = JSON.parse(localStorage.getItem('tasks')) || ['YouTube対応', 'GAS開発', '顧客対応'];
        let timers = JSON.parse(localStorage.getItem('timers')) || [];
        let records = JSON.parse(localStorage.getItem('records')) || [];
        let timerIntervals = {};
        let currentEditId = null;
        let currentEditType = null;
        let expandedBreakdowns = {};
        let infinitePickers = {};

        // カラー設定
        let colorSettings = JSON.parse(localStorage.getItem('colorSettings')) || {
            bg: '#000000',
            primary: '#4a9eff',
            text: '#e8e8e8',
            headerText: '#ffffff'
        };

        function applyColors() {
            const root = document.documentElement;
            root.style.setProperty('--bg-main', colorSettings.bg);
            root.style.setProperty('--primary', colorSettings.primary);
            root.style.setProperty('--text-primary', colorSettings.text);
            root.style.setProperty('--header-text', colorSettings.headerText);
            
            const primaryRgb = hexToRgb(colorSettings.primary);
            const darkerPrimary = `rgb(${Math.max(0, primaryRgb.r - 30)}, ${Math.max(0, primaryRgb.g - 30)}, ${Math.max(0, primaryRgb.b - 30)})`;
            const lighterPrimary = `rgb(${Math.min(255, primaryRgb.r + 30)}, ${Math.min(255, primaryRgb.g + 30)}, ${Math.min(255, primaryRgb.b + 30)})`;
            
            root.style.setProperty('--primary-dark', darkerPrimary);
            root.style.setProperty('--secondary', lighterPrimary);
            
            const bgRgb = hexToRgb(colorSettings.bg);
            const cardBg = `rgb(${Math.min(255, bgRgb.r + 26)}, ${Math.min(255, bgRgb.g + 26)}, ${Math.min(255, bgRgb.b + 26)})`;
            const cardLightBg = `rgb(${Math.min(255, bgRgb.r + 42)}, ${Math.min(255, bgRgb.g + 42)}, ${Math.min(255, bgRgb.b + 42)})`;
            
            root.style.setProperty('--bg-card', cardBg);
            root.style.setProperty('--bg-card-light', cardLightBg);
        }

        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : null;
        }

        function setupColorPickers() {
            const bgPicker = document.getElementById('bgColorPicker');
            const primaryPicker = document.getElementById('primaryColorPicker');
            const textPicker = document.getElementById('textColorPicker');
            const headerTextPicker = document.getElementById('headerTextColorPicker');
            
            bgPicker.value = colorSettings.bg;
            primaryPicker.value = colorSettings.primary;
            textPicker.value = colorSettings.text;
            headerTextPicker.value = colorSettings.headerText;
            
            bgPicker.addEventListener('input', (e) => {
                colorSettings.bg = e.target.value;
                document.getElementById('bgColorPreview').style.background = e.target.value;
                applyColors();
                saveColors();
            });
            
            primaryPicker.addEventListener('input', (e) => {
                colorSettings.primary = e.target.value;
                document.getElementById('primaryColorPreview').style.background = e.target.value;
                applyColors();
                saveColors();
            });
            
            textPicker.addEventListener('input', (e) => {
                colorSettings.text = e.target.value;
                document.getElementById('textColorPreview').style.background = e.target.value;
                applyColors();
                saveColors();
            });

            headerTextPicker.addEventListener('input', (e) => {
                colorSettings.headerText = e.target.value;
                document.getElementById('headerTextColorPreview').style.background = e.target.value;
                applyColors();
                saveColors();
            });
        }

        function saveColors() {
            localStorage.setItem('colorSettings', JSON.stringify(colorSettings));
        }

        function resetColors() {
            colorSettings = {
                bg: '#000000',
                primary: '#4a9eff',
                text: '#e8e8e8',
                headerText: '#ffffff'
            };
            saveColors();
            setupColorPickers();
            applyColors();
        }

        // 無限スクロールピッカー作成（iPhone風）
        function createInfinitePicker(containerId, fields) {
            const container = document.getElementById(containerId);
            if (!container) return null;
            
            container.innerHTML = '';
            container.className = 'infinite-picker-container';
            
            const pickerWrapper = document.createElement('div');
            pickerWrapper.className = 'infinite-picker-wrapper';
            
            const state = {};
            const pickers = [];
            
            fields.forEach((field) => {
                state[field.name] = field.default;
                
                const column = document.createElement('div');
                column.className = 'picker-column';
                
                const scrollArea = document.createElement('div');
                scrollArea.className = 'picker-scroll-area';
                scrollArea.style.WebkitOverflowScrolling = 'touch'; // iPhoneのスムーズスクロール有効化
                
                // 無限スクロール用のデータ生成（5回分のループ）
                const range = field.max - field.min + 1;
                const totalItems = range * 5;
                const centerOffset = Math.floor(totalItems / 2);
                
                let options = [];
                
                // 上にダミー要素を追加（スクロール範囲確保）
                for (let i = 0; i < 5; i++) {
                    const dummy = document.createElement('div');
                    dummy.className = 'picker-option-infinite';
                    dummy.style.visibility = 'hidden';
                    scrollArea.appendChild(dummy);
                }
                
                for (let i = 0; i < totalItems; i++) {
                    const value = field.min + (i % range);
                    const opt = document.createElement('div');
                    opt.className = 'picker-option-infinite';
                    opt.textContent = value;
                    opt.dataset.value = value;
                    opt.dataset.index = i;
                    
                    // クリックで選択（画面に見えてる範囲のみ）
                    opt.addEventListener('click', (e) => {
                        const rect = scrollArea.getBoundingClientRect();
                        const optRect = opt.getBoundingClientRect();
                        
                        // 画面に見えてる範囲内かチェック（中央±100px程度）
                        const scrollCenter = rect.top + rect.height / 2;
                        const distance = Math.abs(optRect.top + optRect.height / 2 - scrollCenter);
                        
                        if (distance < 100) {
                            scrollToValue(value, scrollArea, field, options);
                        }
                    });
                    
                    scrollArea.appendChild(opt);
                    options.push(opt);
                }
                
                // 下にダミー要素を追加（スクロール範囲確保）
                for (let i = 0; i < 5; i++) {
                    const dummy = document.createElement('div');
                    dummy.className = 'picker-option-infinite';
                    dummy.style.visibility = 'hidden';
                    scrollArea.appendChild(dummy);
                }
                
                column.appendChild(scrollArea);
                
                // ラベル
                const label = document.createElement('div');
                label.className = 'picker-label';
                label.textContent = field.label;
                column.appendChild(label);
                
                pickerWrapper.appendChild(column);
                
                // スクロール処理
                let isScrolling;
                let scrollTimeout;
                scrollArea.addEventListener('scroll', () => {
                    clearTimeout(isScrolling);
                    clearTimeout(scrollTimeout);
                    
                    // すぐに表示更新
                    updateVisibleOptions(scrollArea, options);
                    
                    // エンドレスループ処理
                    const scrollTop = scrollArea.scrollTop;
                    const maxScroll = scrollArea.scrollHeight - scrollArea.clientHeight;
                    const itemHeight = 40;
                    const loopThreshold = range * itemHeight; // 1ループ分
                    
                    // 上端に近づいたら下にジャンプ
                    if (scrollTop < loopThreshold) {
                        scrollArea.scrollTop = scrollTop + loopThreshold * 2;
                        return;
                    }
                    
                    // 下端に近づいたら上にジャンプ
                    if (scrollTop > maxScroll - loopThreshold) {
                        scrollArea.scrollTop = scrollTop - loopThreshold * 2;
                        return;
                    }
                    
                    // スクロール終了後にスナップ（少し遅延）
                    isScrolling = setTimeout(() => {
                        scrollTimeout = setTimeout(() => {
                            snapToNearest(scrollArea, field, options);
                        }, 100);
                    }, 150);
                });
                
                // 初期位置設定（ダミー要素分を考慮）
                setTimeout(() => {
                    const targetValue = field.default;
                    const targetIndex = centerOffset + (targetValue - field.min);
                    scrollArea.scrollTop = (targetIndex + 5) * 40; // ダミー5個分オフセット
                    updateVisibleOptions(scrollArea, options);
                }, 10);
                
                pickers.push({
                    scrollArea,
                    options,
                    field
                });
            });
            
            // ハイライト枠
            const highlight = document.createElement('div');
            highlight.className = 'picker-highlight-box';
            pickerWrapper.appendChild(highlight);
            
            container.appendChild(pickerWrapper);
            
            function snapToNearest(scrollArea, field, options) {
                const scrollTop = scrollArea.scrollTop;
                const itemHeight = 40;
                // ダミー5個分を引く
                const adjustedScrollTop = scrollTop - (5 * itemHeight);
                const index = Math.round(adjustedScrollTop / itemHeight);
                
                if (index >= 0 && index < options.length) {
                    // スムーズにスナップ
                    scrollArea.style.scrollBehavior = 'smooth';
                    scrollArea.scrollTop = (index + 5) * itemHeight; // ダミー分戻す
                    
                    setTimeout(() => {
                        scrollArea.style.scrollBehavior = '';
                    }, 300);
                    
                    updateVisibleOptions(scrollArea, options);
                    
                    const value = parseInt(options[index].dataset.value);
                    state[field.name] = value;
                }
            }
            
            function updateVisibleOptions(scrollArea, options) {
                const scrollTop = scrollArea.scrollTop;
                const itemHeight = 40;
                // ダミー5個分を引く
                const adjustedScrollTop = scrollTop - (5 * itemHeight);
                const centerIndex = Math.round(adjustedScrollTop / itemHeight);
                
                options.forEach((opt, idx) => {
                    opt.classList.remove('selected');
                    if (idx === centerIndex) {
                        opt.classList.add('selected');
                    }
                });
            }
            
            function scrollToValue(value, scrollArea, field, options) {
                // 現在のスクロール位置から最も近い target value を探す
                const currentScrollTop = scrollArea.scrollTop;
                const currentIndex = Math.round(currentScrollTop / 40);
                
                let closestIndex = -1;
                let minDistance = Infinity;
                
                options.forEach((opt, idx) => {
                    if (parseInt(opt.dataset.value) === value) {
                        const distance = Math.abs(idx - currentIndex);
                        if (distance < minDistance) {
                            minDistance = distance;
                            closestIndex = idx;
                        }
                    }
                });
                
                if (closestIndex !== -1) {
                    scrollArea.scrollTop = closestIndex * 40;
                    state[field.name] = value;
                    updateVisibleOptions(scrollArea, options);
                }
            }
            
            return {
                getValue: (fieldName) => state[fieldName],
                setValue: (fieldName, value) => {
                    const picker = pickers.find(p => p.field.name === fieldName);
                    if (picker) {
                        state[fieldName] = value;
                        const range = picker.field.max - picker.field.min + 1;
                        const totalItems = range * 5;
                        const centerOffset = Math.floor(totalItems / 2);
                        const targetIndex = centerOffset + (value - picker.field.min);
                        picker.scrollArea.scrollTop = (targetIndex + 5) * 40; // ダミー5個分オフセット
                        updateVisibleOptions(picker.scrollArea, picker.options);
                    }
                },
                getState: () => ({...state})
            };
        }

        // 初期化
        function init() {
            applyColors();
            setupColorPickers();
            updateDateTime();
            setInterval(updateDateTime, 1000);
            loadTasks();
            loadTimers();
            updateManualTaskSelect();
            currentWeekStart = getWeekStart(new Date());
            
            const today = new Date();
            
            // 履歴用ピッカー
            infinitePickers['historyStartDate'] = createInfinitePicker('historyStartDatePicker', [
                {name: 'year', label: '年', min: 2020, max: 2100, default: today.getFullYear()},
                {name: 'month', label: '月', min: 1, max: 12, default: today.getMonth() + 1},
                {name: 'day', label: '日', min: 1, max: 31, default: 1}
            ]);
            
            infinitePickers['historyEndDate'] = createInfinitePicker('historyEndDatePicker', [
                {name: 'year', label: '年', min: 2020, max: 2100, default: today.getFullYear()},
                {name: 'month', label: '月', min: 1, max: 12, default: today.getMonth() + 1},
                {name: 'day', label: '日', min: 1, max: 31, default: today.getDate()}
            ]);
            
            // 編集用ピッカーは編集時に作成する（ここでは作らない）
            
            updateDailyView();
            updateWeeklyView();
            
            timers.forEach(timer => {
                if (timer.running) {
                    startTimerInterval(timer.id);
                }
            });
        }

        function updateDateTime() {
            const now = new Date();
            const options = { 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric', 
                weekday: 'long',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            };
            document.getElementById('currentDateTime').textContent = 
                now.toLocaleDateString('ja-JP', options);
        }

        function switchTab(tabName) {
            document.querySelectorAll('.nav-tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.section').forEach(section => section.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tabName).classList.add('active');

            if (tabName === 'daily') updateDailyView();
            else if (tabName === 'weekly') updateWeeklyView();
        }

        // 作業管理
        function loadTasks() {
            const taskList = document.getElementById('taskList');
            if (tasks.length === 0) {
                taskList.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📝</div><p>まだ作業が登録されていません</p></div>';
                return;
            }

            taskList.innerHTML = tasks.map(task => `
                <div class="task-item">
                    <span>${task}</span>
                    <div style="display: flex; gap: 8px;">
                        <button class="btn btn-primary btn-icon" onclick="editTaskName('${task}')">✏️</button>
                        <button class="btn btn-danger btn-icon" onclick="deleteTask('${task}')">🗑️</button>
                    </div>
                </div>
            `).join('');

            updateTaskSelects();
        }

        function addTask(e) {
            e.preventDefault();
            const taskName = document.getElementById('newTaskName').value.trim();
            if (taskName && !tasks.includes(taskName)) {
                tasks.push(taskName);
                saveTasks();
                loadTasks();
                document.getElementById('newTaskName').value = '';
            } else if (tasks.includes(taskName)) {
                alert('その作業名は既に登録されています');
                document.getElementById('newTaskName').value = '';
            }
        }

        function deleteTask(taskName) {
            if (confirm(`「${taskName}」を削除しますか？`)) {
                tasks = tasks.filter(t => t !== taskName);
                saveTasks();
                loadTasks();
            }
        }

        function editTaskName(oldName) {
            const newName = prompt('新しい作業名を入力してください', oldName);
            if (newName && newName.trim() !== '' && newName !== oldName) {
                const trimmedName = newName.trim();
                
                // 既に存在する名前かチェック
                if (tasks.includes(trimmedName)) {
                    alert('その作業名は既に存在します');
                    return;
                }
                
                // タスクリストの名前を変更
                const index = tasks.indexOf(oldName);
                if (index !== -1) {
                    tasks[index] = trimmedName;
                }
                
                // すべての記録の作業名を変更
                records.forEach(record => {
                    if (record.task === oldName) {
                        record.task = trimmedName;
                    }
                });
                
                // すべてのタイマーの作業名を変更
                timers.forEach(timer => {
                    if (timer.task === oldName) {
                        timer.task = trimmedName;
                    }
                });
                
                saveTasks();
                saveRecords();
                saveTimers();
                loadTasks();
                loadTimers();
                updateDailyView();
                updateWeeklyView();
                
                alert('作業名を変更しました');
            }
        }

        function saveTasks() {
            localStorage.setItem('tasks', JSON.stringify(tasks));
        }

        function updateTaskSelects() {
            const selects = ['newTimerTask', 'editTask', 'manualEntryTask'];
            selects.forEach(selectId => {
                const select = document.getElementById(selectId);
                const currentValue = select.value;
                let options = '<option value="">選択してください</option>' + 
                    tasks.map(task => `<option value="${task}">${task}</option>`).join('');
                
                if (selectId === 'newTimerTask') {
                    options += '<option value="__custom__">➕ 新しい作業を追加</option>';
                }
                
                select.innerHTML = options;
                if (tasks.includes(currentValue)) {
                    select.value = currentValue;
                }
            });
        }

        function toggleCustomTaskInput() {
            const select = document.getElementById('newTimerTask');
            const customGroup = document.getElementById('customTaskGroup');
            customGroup.style.display = select.value === '__custom__' ? 'block' : 'none';
        }

        function updateManualTaskSelect() {
            updateTaskSelects();
        }

        // タイマー機能
        function loadTimers() {
            const container = document.getElementById('activeTimers');
            const activeTimers = timers.filter(t => !t.completed);
            
            if (activeTimers.length === 0) {
                container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">⏱️</div><p>アクティブなタイマーはありません</p></div>';
                return;
            }

            container.innerHTML = activeTimers.map(timer => `
                <div class="timer-container">
                    <div class="timer-task-name">${timer.task}</div>
                    <div class="timer-display ${timer.running ? 'running' : ''}" id="timer-${timer.id}">
                        ${formatTimeJapanese(Math.floor(timer.elapsed / 1000))}
                    </div>
                    <div class="timer-buttons">
                        <button class="btn btn-danger" onclick="pauseTimer('${timer.id}')" ${!timer.running ? 'disabled' : ''}>⏸️ 一時停止</button>
                        <button class="btn btn-primary" onclick="resumeTimer('${timer.id}')" ${timer.running ? 'disabled' : ''}>▶️ 再開</button>
                        <button class="btn btn-secondary" onclick="resetTimer('${timer.id}')">🔄 リセット</button>
                        <button class="btn btn-success" onclick="completeTimer('${timer.id}')" style="grid-column: span 3;">✅ 完了</button>
                    </div>
                </div>
            `).join('');
        }

        function showNewTimerModal() {
            if (timers.filter(t => !t.completed).length >= 3) {
                alert('同時に実行できるタイマーは3つまでです');
                return;
            }
            document.getElementById('newTimerModal').classList.add('active');
        }

        function startNewTimer() {
            const taskSelect = document.getElementById('newTimerTask').value;
            let task;
            
            if (taskSelect === '__custom__') {
                task = document.getElementById('customTaskInput').value.trim();
                if (!task) {
                    alert('作業名を入力してください');
                    return;
                }
                if (!tasks.includes(task)) {
                    tasks.push(task);
                    saveTasks();
                    loadTasks();
                }
            } else {
                task = taskSelect;
            }
            
            if (!task) {
                alert('作業を選択してください');
                return;
            }

            const timer = {
                id: Date.now().toString(),
                task: task,
                startTime: Date.now(),
                elapsed: 0,
                running: true,
                completed: false,
                date: formatDate(new Date())
            };

            timers.push(timer);
            saveTimers();
            startTimerInterval(timer.id);
            loadTimers();
            closeModal('newTimerModal');
            document.getElementById('customTaskInput').value = '';
        }

        function startTimerInterval(timerId) {
            timerIntervals[timerId] = setInterval(() => {
                const timer = timers.find(t => t.id === timerId);
                if (timer && timer.running) {
                    timer.elapsed = Date.now() - timer.startTime;
                    const elem = document.getElementById(`timer-${timerId}`);
                    if (elem) elem.textContent = formatTimeJapanese(Math.floor(timer.elapsed / 1000));
                    saveTimers();
                }
            }, 1000);
        }

        function pauseTimer(timerId) {
            const timer = timers.find(t => t.id === timerId);
            if (timer) {
                timer.running = false;
                clearInterval(timerIntervals[timerId]);
                saveTimers();
                loadTimers();
            }
        }

        function resumeTimer(timerId) {
            const timer = timers.find(t => t.id === timerId);
            if (timer) {
                timer.startTime = Date.now() - timer.elapsed;
                timer.running = true;
                startTimerInterval(timerId);
                saveTimers();
                loadTimers();
            }
        }

        function resetTimer(timerId) {
            if (confirm('このタイマーをリセットしますか？')) {
                const timer = timers.find(t => t.id === timerId);
                if (timer) {
                    timer.elapsed = 0;
                    timer.startTime = Date.now();
                    saveTimers();
                    const elem = document.getElementById(`timer-${timerId}`);
                    if (elem) elem.textContent = formatTimeJapanese(0);
                }
            }
        }

        function completeTimer(timerId) {
            const timer = timers.find(t => t.id === timerId);
            if (timer) {
                timer.running = false;
                timer.completed = true;
                clearInterval(timerIntervals[timerId]);
                
                const totalSeconds = Math.round(timer.elapsed / 1000);
                if (totalSeconds > 0) {
                    records.push({
                        id: Date.now().toString(),
                        task: timer.task,
                        date: timer.date,
                        hours: Math.floor(totalSeconds / 3600),
                        minutes: Math.floor((totalSeconds % 3600) / 60),
                        seconds: totalSeconds % 60
                    });
                    saveRecords();
                }
                
                saveTimers();
                loadTimers();
                updateDailyView();
                updateWeeklyView();
            }
        }

        function saveTimers() {
            localStorage.setItem('timers', JSON.stringify(timers));
        }

        // 手動入力
        function saveRecords() {
            localStorage.setItem('records', JSON.stringify(records));
        }

        // 日別ビュー
        let currentDailyDate = new Date();

        function navigateDaily(direction) {
            currentDailyDate = new Date(currentDailyDate);
            currentDailyDate.setDate(currentDailyDate.getDate() + direction);
            updateDailyView();
        }

        function updateDailyView() {
            const dateStr = formatDate(currentDailyDate);
            const dayRecords = records.filter(r => r.date === dateStr);
            
            const today = new Date();
            const todayStr = formatDate(today);
            const yesterday = new Date(today);
            yesterday.setDate(yesterday.getDate() - 1);
            const yesterdayStr = formatDate(yesterday);
            
            const navLabel = document.getElementById('dailyNavLabel');
            if (dateStr === todayStr) {
                navLabel.textContent = '今日';
            } else if (dateStr === yesterdayStr) {
                navLabel.textContent = '昨日';
            } else {
                navLabel.textContent = formatDateJP(currentDailyDate);
            }

            const weekdays = ['日', '月', '火', '水', '木', '金', '土'];
            const dateDisplay = document.getElementById('dailyDateDisplay');
            dateDisplay.textContent = `${currentDailyDate.getFullYear()}年${currentDailyDate.getMonth() + 1}月${currentDailyDate.getDate()}日 (${weekdays[currentDailyDate.getDay()]})`;

            const totalSeconds = dayRecords.reduce((sum, r) => sum + ((r.hours || 0) * 3600 + (r.minutes || 0) * 60 + (r.seconds || 0)), 0);
            document.getElementById('dailyTotal').textContent = formatTimeJapanese(totalSeconds);

            const breakdown = {};
            const breakdownRecords = {};
            dayRecords.forEach(r => {
                const key = r.task;
                const seconds = (r.hours || 0) * 3600 + (r.minutes || 0) * 60 + (r.seconds || 0);
                if (!breakdown[key]) {
                    breakdown[key] = 0;
                    breakdownRecords[key] = [];
                }
                breakdown[key] += seconds;
                breakdownRecords[key].push(r);
            });

            drawPieChart('dailyPieChart', 'dailyChartLegend', breakdown, totalSeconds);

            const breakdownDiv = document.getElementById('dailyBreakdown');
            if (Object.keys(breakdown).length === 0) {
                breakdownDiv.innerHTML = '<div class="empty-state"><p>記録がありません</p></div>';
            } else {
                breakdownDiv.innerHTML = Object.entries(breakdown)
                    .sort((a, b) => b[1] - a[1])
                    .map(([task, seconds]) => {
                        const taskRecords = breakdownRecords[task];
                        const isExpanded = expandedBreakdowns[`daily-${dateStr}-${task}`];
                        
                        return `
                            <div class="breakdown-item">
                                <div class="breakdown-header" onclick="toggleBreakdown('daily-${dateStr}-${task}', event)">
                                    <div class="breakdown-left">
                                        <span class="breakdown-task">${task}</span>
                                        <span class="expand-icon ${isExpanded ? 'expanded' : ''}">▼</span>
                                    </div>
                                    <div class="breakdown-right">
                                        <span class="breakdown-time">${formatTimeJapanese(seconds)}</span>
                                        <button class="btn btn-primary btn-icon" onclick="event.stopPropagation(); editAggregatedRecord('${task}', '${dateStr}', ${seconds})">✏️</button>
                                    </div>
                                </div>
                                <div class="breakdown-details ${isExpanded ? 'expanded' : ''}">
                                    ${taskRecords.map(r => {
                                        const rSeconds = (r.hours || 0) * 3600 + (r.minutes || 0) * 60 + (r.seconds || 0);
                                        return `
                                            <div class="breakdown-detail-item">
                                                <span class="breakdown-detail-time">${formatTimeJapanese(rSeconds)}</span>
                                                <button class="btn btn-primary btn-icon" onclick="editRecord('${r.id}')">✏️</button>
                                            </div>
                                        `;
                                    }).join('')}
                                </div>
                            </div>
                        `;
                    }).join('');
            }

            const recordsDiv = document.getElementById('dailyRecords');
            if (dayRecords.length === 0) {
                recordsDiv.innerHTML = '<div class="empty-state"><p>記録がありません</p></div>';
            } else {
                recordsDiv.innerHTML = dayRecords.map(r => {
                    const seconds = (r.hours || 0) * 3600 + (r.minutes || 0) * 60 + (r.seconds || 0);
                    return `
                        <div class="record-item">
                            <div class="record-info">
                                <div class="record-task">${r.task}</div>
                                <div class="record-meta">${r.date}</div>
                            </div>
                            <span class="record-time">${formatTimeJapanese(seconds)}</span>
                            <div class="record-actions">
                                <button class="btn btn-primary btn-icon" onclick="editRecord('${r.id}')">✏️</button>
                            </div>
                        </div>
                    `;
                }).join('');
            }
        }

        function toggleBreakdown(id, event) {
            if (event) event.stopPropagation();
            expandedBreakdowns[id] = !expandedBreakdowns[id];
            updateDailyView();
            updateWeeklyView();
        }

        function formatDateJP(date) {
            return `${date.getMonth() + 1}/${date.getDate()}`;
        }

        // 日別内訳をコピー
        function copyDailyBreakdown() {
            const dateStr = formatDate(currentDailyDate);
            const dayRecords = records.filter(r => r.date === dateStr);
            
            if (dayRecords.length === 0) {
                alert('記録がありません');
                return;
            }
            
            const breakdown = {};
            dayRecords.forEach(r => {
                const seconds = (r.hours || 0) * 3600 + (r.minutes || 0) * 60 + (r.seconds || 0);
                if (!breakdown[r.task]) breakdown[r.task] = 0;
                breakdown[r.task] += seconds;
            });
            
            // 曜日を取得
            const weekdays = ['日', '月', '火', '水', '木', '金', '土'];
            const dayOfWeek = weekdays[currentDailyDate.getDay()];
            
            // テキスト作成
            const dateText = `${currentDailyDate.getMonth() + 1}/${currentDailyDate.getDate()}（${dayOfWeek}）日報`;
            const breakdownText = Object.entries(breakdown)
                .sort((a, b) => b[1] - a[1])
                .map(([task, seconds]) => {
                    let hours = Math.floor(seconds / 3600);
                    let minutes = Math.floor((seconds % 3600) / 60);
                    const remainingSeconds = seconds % 60;
                    
                    // 秒が1秒でもあれば分を切り上げ
                    if (remainingSeconds > 0) {
                        minutes += 1;
                        if (minutes >= 60) {
                            hours += 1;
                            minutes = 0;
                        }
                    }
                    
                    if (hours > 0 && minutes > 0) {
                        return `・${task} ${hours}時間${minutes}分`;
                    } else if (hours > 0) {
                        return `・${task} ${hours}時間`;
                    } else {
                        return `・${task} ${minutes}分`;
                    }
                })
                .join('\n');
            
            const fullText = `${dateText}\n\n${breakdownText}`;
            
            // クリップボードにコピー
            navigator.clipboard.writeText(fullText).then(() => {
                alert('コピーしました！');
            }).catch(() => {
                // フォールバック（古いブラウザ対応）
                const textarea = document.createElement('textarea');
                textarea.value = fullText;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                alert('コピーしました！');
            });
        }

        // 週別ビュー
        let currentWeekStart = null;

        function navigateWeekly(direction) {
            currentWeekStart = new Date(currentWeekStart);
            currentWeekStart.setDate(currentWeekStart.getDate() + (direction * 7));
            updateWeeklyView();
        }

        function getWeekStart(date) {
            const d = new Date(date);
            const day = d.getDay();
            const diff = day === 0 ? -6 : 1 - day;
            d.setDate(d.getDate() + diff);
            d.setHours(0, 0, 0, 0);
            return d;
        }

        function updateWeeklyView() {
            if (!currentWeekStart) {
                currentWeekStart = getWeekStart(new Date());
            }
            
            const weekEnd = new Date(currentWeekStart);
            weekEnd.setDate(weekEnd.getDate() + 6);

            const weekRecords = records.filter(r => {
                const recordDate = new Date(r.date);
                return recordDate >= currentWeekStart && recordDate <= weekEnd;
            });

            const thisWeekStart = getWeekStart(new Date());
            const navLabel = document.getElementById('weeklyNavLabel');
            if (currentWeekStart.getTime() === thisWeekStart.getTime()) {
                navLabel.textContent = '今週';
            } else {
                const lastWeekStart = new Date(thisWeekStart);
                lastWeekStart.setDate(lastWeekStart.getDate() - 7);
                if (currentWeekStart.getTime() === lastWeekStart.getTime()) {
                    navLabel.textContent = '先週';
                } else {
                    navLabel.textContent = `${currentWeekStart.getMonth() + 1}/${currentWeekStart.getDate()}の週`;
                }
            }

            const dateDisplay = document.getElementById('weeklyDateDisplay');
            dateDisplay.textContent = `${currentWeekStart.getFullYear()}年${currentWeekStart.getMonth() + 1}月${currentWeekStart.getDate()}日 〜 ${weekEnd.getMonth() + 1}月${weekEnd.getDate()}日`;

            const totalSeconds = weekRecords.reduce((sum, r) => sum + ((r.hours || 0) * 3600 + (r.minutes || 0) * 60 + (r.seconds || 0)), 0);
            document.getElementById('weeklyTotal').textContent = formatTimeJapanese(totalSeconds);

            const breakdown = {};
            const breakdownRecords = {};
            weekRecords.forEach(r => {
                const seconds = (r.hours || 0) * 3600 + (r.minutes || 0) * 60 + (r.seconds || 0);
                if (!breakdown[r.task]) {
                    breakdown[r.task] = 0;
                    breakdownRecords[r.task] = [];
                }
                breakdown[r.task] += seconds;
                breakdownRecords[r.task].push(r);
            });

            drawPieChart('weeklyPieChart', 'weeklyChartLegend', breakdown, totalSeconds);

            const breakdownDiv = document.getElementById('weeklyBreakdown');
            const weekId = `${formatDate(currentWeekStart)}`;
            if (Object.keys(breakdown).length === 0) {
                breakdownDiv.innerHTML = '<div class="empty-state"><p>記録がありません</p></div>';
            } else {
                breakdownDiv.innerHTML = Object.entries(breakdown)
                    .sort((a, b) => b[1] - a[1])
                    .map(([task, seconds]) => {
                        const taskRecords = breakdownRecords[task];
                        const isExpanded = expandedBreakdowns[`weekly-${weekId}-${task}`];
                        
                        return `
                            <div class="breakdown-item">
                                <div class="breakdown-header" onclick="toggleBreakdown('weekly-${weekId}-${task}', event)">
                                    <div class="breakdown-left">
                                        <span class="breakdown-task">${task}</span>
                                        <span class="expand-icon ${isExpanded ? 'expanded' : ''}">▼</span>
                                    </div>
                                    <div class="breakdown-right">
                                        <span class="breakdown-time">${formatTimeJapanese(seconds)}</span>
                                        <button class="btn btn-primary btn-icon" onclick="event.stopPropagation(); alert('週別の総合計編集は個別記録から行ってください')">✏️</button>
                                    </div>
                                </div>
                                <div class="breakdown-details ${isExpanded ? 'expanded' : ''}">
                                    ${taskRecords.map(r => {
                                        const rSeconds = (r.hours || 0) * 3600 + (r.minutes || 0) * 60 + (r.seconds || 0);
                                        return `
                                            <div class="breakdown-detail-item">
                                                <span class="breakdown-detail-time">${r.date} - ${formatTimeJapanese(rSeconds)}</span>
                                                <button class="btn btn-primary btn-icon" onclick="editRecord('${r.id}')">✏️</button>
                                            </div>
                                        `;
                                    }).join('')}
                                </div>
                            </div>
                        `;
                    }).join('');
            }

            const dailySummary = {};
            const weekDays = ['月', '火', '水', '木', '金', '土', '日'];
            
            for (let i = 0; i < 7; i++) {
                const d = new Date(currentWeekStart);
                d.setDate(d.getDate() + i);
                const dateStr = formatDate(d);
                const dayRecords = weekRecords.filter(r => r.date === dateStr);
                const seconds = dayRecords.reduce((sum, r) => sum + ((r.hours || 0) * 3600 + (r.minutes || 0) * 60 + (r.seconds || 0)), 0);
                dailySummary[dateStr] = {
                    day: weekDays[i],
                    date: `${d.getMonth() + 1}/${d.getDate()}`,
                    seconds: seconds
                };
            }

            const summaryDiv = document.getElementById('weeklyDailySummary');
            summaryDiv.innerHTML = Object.entries(dailySummary).map(([date, data]) => `
                <div class="breakdown-item">
                    <div class="breakdown-header" style="cursor: default;">
                        <span class="breakdown-task">${data.day} (${data.date})</span>
                        <span class="breakdown-time">${formatTimeJapanese(data.seconds)}</span>
                    </div>
                </div>
            `).join('');
        }

        // 円グラフ
        const chartColors = [
            '#4a9eff', '#51cf66', '#ffd43b', '#ff6b6b', '#a78bfa', 
            '#fb923c', '#f472b6', '#38bdf8', '#22d3ee', '#a3e635'
        ];

        function drawPieChart(canvasId, legendId, breakdown, totalSeconds) {
            const canvas = document.getElementById(canvasId);
            const legendDiv = document.getElementById(legendId);
            
            if (!canvas || !legendDiv) return;
            
            const existingChart = Chart.getChart(canvas);
            if (existingChart) existingChart.destroy();

            if (totalSeconds === 0 || Object.keys(breakdown).length === 0) {
                legendDiv.innerHTML = '<div class="empty-state"><p>データがありません</p></div>';
                return;
            }

            const sortedEntries = Object.entries(breakdown).sort((a, b) => b[1] - a[1]);
            const labels = sortedEntries.map(([task]) => task);
            const data = sortedEntries.map(([, seconds]) => seconds);

            new Chart(canvas, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        backgroundColor: chartColors.slice(0, labels.length),
                        borderColor: colorSettings.bg,
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    const seconds = context.parsed;
                                    return `${context.label}: ${formatTimeJapanese(seconds)}`;
                                }
                            }
                        },
                        datalabels: {
                            color: '#ffffff',
                            font: {
                                weight: 'bold',
                                size: 11
                            },
                            formatter: (value, ctx) => {
                                const percentage = ((value / totalSeconds) * 100).toFixed(1);
                                const label = ctx.chart.data.labels[ctx.dataIndex];
                                const seconds = value;
                                
                                // パーセントが5%以上の時だけ表示
                                if (percentage >= 5) {
                                    const hours = Math.floor(seconds / 3600);
                                    const minutes = Math.floor((seconds % 3600) / 60);
                                    
                                    let timeStr = '';
                                    if (hours > 0 && minutes > 0) {
                                        timeStr = `${hours}時間${minutes}分`;
                                    } else if (hours > 0) {
                                        timeStr = `${hours}時間`;
                                    } else {
                                        timeStr = `${minutes}分`;
                                    }
                                    
                                    return `${label}\n${timeStr}\n${percentage}%`;
                                }
                                return '';
                            }
                        }
                    }
                },
                plugins: [ChartDataLabels]
            });

            legendDiv.innerHTML = sortedEntries.map(([task], index) => `
                <div class="legend-item">
                    <div class="legend-color" style="background: ${chartColors[index]};"></div>
                    <div class="legend-task">${task}</div>
                </div>
            `).join('');
        }

        // 履歴
        function loadHistory() {
            const startState = infinitePickers['historyStartDate'] ? infinitePickers['historyStartDate'].getState() : null;
            const endState = infinitePickers['historyEndDate'] ? infinitePickers['historyEndDate'].getState() : null;

            let startDate = null;
            let endDate = null;
            
            if (startState) {
                startDate = `${startState.year}-${String(startState.month).padStart(2, '0')}-${String(startState.day).padStart(2, '0')}`;
            }
            
            if (endState) {
                endDate = `${endState.year}-${String(endState.month).padStart(2, '0')}-${String(endState.day).padStart(2, '0')}`;
            }
            
            const today = new Date();
            const todayStr = formatDate(today);
            
            let filteredRecords;
            
            if (startDate && endDate) {
                filteredRecords = records.filter(r => r.date >= startDate && r.date <= endDate);
            } else if (startDate && !endDate) {
                filteredRecords = records.filter(r => r.date >= startDate && r.date <= todayStr);
            } else if (!startDate && endDate) {
                filteredRecords = records.filter(r => r.date <= endDate);
            } else {
                filteredRecords = records;
            }

            const resultsDiv = document.getElementById('historyResults');
            
            if (filteredRecords.length === 0) {
                resultsDiv.innerHTML = '<div class="card"><div class="empty-state"><p>指定期間の記録がありません</p></div></div>';
                return;
            }

            const totalSeconds = filteredRecords.reduce((sum, r) => sum + ((r.hours || 0) * 3600 + (r.minutes || 0) * 60 + (r.seconds || 0)), 0);

            const breakdown = {};
            filteredRecords.forEach(r => {
                const seconds = (r.hours || 0) * 3600 + (r.minutes || 0) * 60 + (r.seconds || 0);
                if (!breakdown[r.task]) breakdown[r.task] = 0;
                breakdown[r.task] += seconds;
            });

            resultsDiv.innerHTML = `
                <div class="summary-box">
                    <div class="summary-label">期間総時間</div>
                    <div class="summary-value">${formatTimeJapanese(totalSeconds)}</div>
                </div>
                <div class="card">
                    <div class="card-header">作業別内訳</div>
                    ${Object.entries(breakdown)
                        .sort((a, b) => b[1] - a[1])
                        .map(([task, seconds]) => `
                            <div class="breakdown-item">
                                <div class="breakdown-header" style="cursor: default;">
                                    <span class="breakdown-task">${task}</span>
                                    <span class="breakdown-time">${formatTimeJapanese(seconds)}</span>
                                </div>
                            </div>
                        `).join('')}
                </div>
                <div class="card">
                    <div class="card-header">記録一覧 (${filteredRecords.length}件)</div>
                    ${filteredRecords.map(r => {
                        const seconds = (r.hours || 0) * 3600 + (r.minutes || 0) * 60 + (r.seconds || 0);
                        return `
                            <div class="record-item">
                                <div class="record-info">
                                    <div class="record-task">${r.task}</div>
                                    <div class="record-meta">${r.date}</div>
                                </div>
                                <span class="record-time">${formatTimeJapanese(seconds)}</span>
                                <div class="record-actions">
                                    <button class="btn btn-primary btn-icon" onclick="editRecord('${r.id}')">✏️</button>
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        }

        // 編集・削除
        function editRecord(recordId) {
            const record = records.find(r => r.id === recordId);
            if (!record) {
                alert('レコードが見つかりません');
                return;
            }
            
            currentEditId = recordId;
            currentEditType = 'single';
            
            // 日付と時間のパース
            const dateParts = record.date.split('-');
            const year = parseInt(dateParts[0]);
            const month = parseInt(dateParts[1]);
            const day = parseInt(dateParts[2]);
            const hours = parseInt(record.hours) || 0;
            const minutes = parseInt(record.minutes) || 0;
            const seconds = parseInt(record.seconds) || 0;
            
            // フォームに値を設定
            document.getElementById('editTask').value = record.task;
            document.getElementById('editYear').value = year;
            document.getElementById('editMonth').value = month;
            document.getElementById('editDay').value = day;
            document.getElementById('editHours').value = hours;
            document.getElementById('editMinutes').value = minutes;
            document.getElementById('editSeconds').value = seconds;
            
            // モーダルを開く
            document.getElementById('editModal').classList.add('active');
        }

        function editAggregatedRecord(task, date, totalSeconds) {
            currentEditType = 'aggregated';
            currentEditId = `${task}-${date}`;
            
            const dateParts = date.split('-');
            const year = parseInt(dateParts[0]);
            const month = parseInt(dateParts[1]);
            const day = parseInt(dateParts[2]);
            
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;
            
            // フォームに値を設定
            document.getElementById('editTask').value = task;
            document.getElementById('editYear').value = year;
            document.getElementById('editMonth').value = month;
            document.getElementById('editDay').value = day;
            document.getElementById('editHours').value = hours;
            document.getElementById('editMinutes').value = minutes;
            document.getElementById('editSeconds').value = seconds;
            
            // モーダルを開く
            document.getElementById('editModal').classList.add('active');
        }

        function saveEdit() {
            const task = document.getElementById('editTask').value;
            const year = parseInt(document.getElementById('editYear').value);
            const month = parseInt(document.getElementById('editMonth').value);
            const day = parseInt(document.getElementById('editDay').value);
            const hours = parseInt(document.getElementById('editHours').value) || 0;
            const minutes = parseInt(document.getElementById('editMinutes').value) || 0;
            const seconds = parseInt(document.getElementById('editSeconds').value) || 0;

            const date = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;

            if (currentEditType === 'single') {
                const record = records.find(r => r.id === currentEditId);
                if (record) {
                    record.task = task;
                    record.date = date;
                    record.hours = hours;
                    record.minutes = minutes;
                    record.seconds = seconds;
                }
            } else if (currentEditType === 'aggregated') {
                const [oldTask, oldDate] = currentEditId.split('-').slice(0, 2);
                const fullOldDate = currentEditId.substring(oldTask.length + 1);
                
                const relatedRecords = records.filter(r => r.task === oldTask && r.date === fullOldDate);
                relatedRecords.forEach(r => records = records.filter(rec => rec.id !== r.id));
                
                records.push({
                    id: Date.now().toString(),
                    task: task,
                    date: date,
                    hours: hours,
                    minutes: minutes,
                    seconds: seconds
                });
            }

            saveRecords();
            closeEditModal();
            updateDailyView();
            updateWeeklyView();
        }

        function deleteRecord() {
            if (currentEditType === 'single') {
                if (confirm('この記録を削除しますか？')) {
                    records = records.filter(r => r.id !== currentEditId);
                    saveRecords();
                    closeModal('editModal');
                    updateDailyView();
                    updateWeeklyView();
                }
            } else if (currentEditType === 'aggregated') {
                if (confirm('この作業のすべての記録を削除しますか？')) {
                    const [task, fullDate] = [currentEditId.split('-')[0], currentEditId.substring(currentEditId.split('-')[0].length + 1)];
                    records = records.filter(r => !(r.task === task && r.date === fullDate));
                    saveRecords();
                    closeModal('editModal');
                    updateDailyView();
                    updateWeeklyView();
                }
            }
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }
        
        function closeEditModal() {
            document.getElementById('editModal').classList.remove('active');
            currentEditId = null;
            currentEditType = null;
        }
        
        // 手動入力モーダル
        function openManualEntryModal() {
            const today = new Date();
            document.getElementById('manualEntryYear').value = today.getFullYear();
            document.getElementById('manualEntryMonth').value = today.getMonth() + 1;
            document.getElementById('manualEntryDay').value = today.getDate();
            document.getElementById('manualEntryHours').value = 0;
            document.getElementById('manualEntryMinutes').value = 0;
            document.getElementById('manualEntrySeconds').value = 0;
            document.getElementById('manualEntryModal').classList.add('active');
        }
        
        function adjustTime(inputId, delta) {
            const input = document.getElementById(inputId);
            let value = parseInt(input.value) || 0;
            value += delta;
            
            const min = parseInt(input.min);
            const max = parseInt(input.max);
            
            // ループ処理
            if (value < min) value = max;
            if (value > max) value = min;
            
            input.value = value;
        }
        
        function saveManualEntry() {
            const task = document.getElementById('manualEntryTask').value;
            const year = parseInt(document.getElementById('manualEntryYear').value);
            const month = parseInt(document.getElementById('manualEntryMonth').value);
            const day = parseInt(document.getElementById('manualEntryDay').value);
            const hours = parseInt(document.getElementById('manualEntryHours').value) || 0;
            const minutes = parseInt(document.getElementById('manualEntryMinutes').value) || 0;
            const seconds = parseInt(document.getElementById('manualEntrySeconds').value) || 0;
            
            if (!task || !year || !month || !day) {
                alert('すべての項目を入力してください');
                return;
            }
            
            const date = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
            
            records.push({
                id: Date.now().toString(),
                task: task,
                date: date,
                hours: hours,
                minutes: minutes,
                seconds: seconds
            });
            
            saveRecords();
            closeModal('manualEntryModal');
            alert('記録を追加しました');
            updateDailyView();
            updateWeeklyView();
        }

        // ユーティリティ
        function formatDate(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function formatTimeJapanese(totalSeconds) {
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;
            return `${hours}時間${minutes}分${seconds}秒`;
        }

        // モーダル外クリックで閉じる
        document.querySelectorAll('.modal').forEach(modal => {
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    modal.classList.remove('active');
                }
            });
        });

        // 起動
        init();
    </script>
</body>
</html>
